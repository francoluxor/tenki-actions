name: '[Deprecated] Publish Tenki Sandbox Template'
description: Deprecated; use template-build with .tenki/template.json. Legacy create, update, build, and publish workflow.
author: Tenki Cloud
inputs:
  mode:
    description: create, update, build-only, or publish-only.
    required: true
  name:
    description: Template name. Required for create.
    required: false
  template-id:
    description: Template ID. Required for update, build-only, and publish-only.
    required: false
  image:
    description: Registry image ref <workspace>/<artifact>[:tag]. Uses registry publish when set.
    required: false
  visibility:
    description: Registry visibility for published image, private or public.
    required: false
    default: public
  setup-script:
    description: Inline setup script.
    required: false
  setup-script-path:
    description: Path to setup script, relative to GITHUB_WORKSPACE unless absolute.
    required: false
  base-image-id:
    description: Base image ID.
    required: false
  tags:
    description: Comma-separated tags.
    required: false
  cpu:
    description: CPU cores.
    required: false
  memory-mb:
    description: Memory in MB.
    required: false
  disk-size-gb:
    description: Disk size in GB.
    required: false
  env:
    description: Newline-separated env var names to forward, or * for TENKI_TPL_ prefixed vars.
    required: false
  env-prefix:
    description: Prefix used when env is *.
    required: false
    default: TENKI_TPL_
  wait-timeout:
    description: Build wait timeout.
    required: false
    default: 15m
  wait-durable:
    description: Also wait for the snapshot R2 upload to finish (recommended). Defaults to true.
    required: false
    default: 'true'
  publish-raw-image:
    description: Override whether template builds publish a standalone compressed raw disk image. Empty uses the Tenki default.
    required: false
outputs:
  template-id:
    description: Template ID.
  artifact-id:
    description: Registry artifact ID, empty for build-only.
  snapshot-id:
    description: Snapshot ID from build or publish.
  raw-image-available:
    description: true when the snapshot has a standalone compressed raw disk image.
  raw-image-url:
    description: Short-lived download URL for the raw disk image, empty when unavailable.
  raw-image-expires-at:
    description: Expiration time for raw-image-url.
  image:
    description: Published image ref, empty for build-only.
  publication-id:
    description: Deprecated alias for artifact-id. Empty for build-only.
  template-build-id:
    description: Template build ID.
  template-build-state:
    description: Template build state.
runs:
  using: node24
  main: dist/index.js
branding:
  icon: upload-cloud
  color: blue
